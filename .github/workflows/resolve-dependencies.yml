name: Resolve security dependency updates

on:
  push:
    branches:
      - piroyoung-dependabot-fixes-release
    paths:
      - pyproject.toml
      - .github/workflows/resolve-dependencies.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - run: uv lock --upgrade-package certifi --upgrade-package pillow --upgrade-package nbconvert --upgrade-package tornado
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: patched-lockfile
          path: uv.lock
