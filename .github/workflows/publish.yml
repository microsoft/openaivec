name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag to validate and publish"
        required: true
        type: string
      expected_commit:
        description: "Full commit SHA targeted by the release tag"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: integration
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Verify tag points to checked-out commit
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          else
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "$GITHUB_REF" = "refs/heads/main"
          fi
          test "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies via uv
        run: uv sync --locked --python ${{ matrix.python-version }} --all-extras --dev

      - name: Lint and type check
        run: |
          uv run ruff check .
          uv run pyright src/openaivec

      - name: Run full suite
        run: |
          test -n "$OPENAI_API_KEY"
          uv run pytest

      - name: Validate distribution
        if: matrix.python-version == '3.10'
        run: uv build

  build-and-publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify tag points to tested commit
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies via uv
        run: uv sync --locked --all-extras --dev

      - name: Build with uv
        run: uv build

      - name: Verify distribution version
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # uv build can create dist/.gitignore alongside the two distributions.
          test "$(find dist -maxdepth 1 -type f ! -name '.gitignore' | wc -l)" -eq 2
          wheel="dist/openaivec-${version}-py3-none-any.whl"
          sdist="dist/openaivec-${version}.tar.gz"
          test -f "$wheel"
          test -f "$sdist"
          unzip -p "$wheel" "openaivec-${version}.dist-info/METADATA" | grep -qx "Version: $version"
          tar -xOf "$sdist" "openaivec-${version}/PKG-INFO" | grep -qx "Version: $version"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifacts with cosign (OIDC)
        run: |
          set -euo pipefail
          ls -la dist
          mkdir -p signatures
          for f in dist/*; do
            if [ -f "$f" ]; then
              base="$(basename "$f")"
              cosign sign-blob --yes \
                --bundle "signatures/${base}.bundle.json" \
                "$f"
            fi
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ inputs.expected_commit || github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            signatures/*.bundle.json

      - name: Remove mismatched assets from an incomplete release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          while IFS= read -r asset; do
            case "$asset" in
              "openaivec-${version}-"*.whl | "openaivec-${version}.tar.gz" | \
              "openaivec-${version}-"*.whl.bundle.json | "openaivec-${version}.tar.gz.bundle.json")
                ;;
              openaivec-*)
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes
                ;;
            esac
          done <<< "$assets"

      - name: Verify GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for artifact in dist/* signatures/*; do
            grep -Fxq "$(basename "$artifact")" <<< "$assets"
          done
