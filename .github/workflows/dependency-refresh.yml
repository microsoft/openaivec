name: Verify updated dependencies

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'chore/dependency-refresh-20260911'
    runs-on: ubuntu-latest
    environment: integration
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install and verify dependencies
        run: |
          uv sync --locked --python ${{ matrix.python-version }} --all-extras --dev --group docs
          uv pip check
          uv pip list --format json > dependency-refresh-packages.json

      - name: Lint with ruff
        run: uv run --no-sync ruff check .

      - name: Type check with pyright
        run: uv run --no-sync pyright src/openaivec

      - name: Run tests
        run: uv run --no-sync pytest tests -q --junitxml=dependency-refresh-tests.xml

      - name: Build documentation
        if: matrix.python-version == '3.10'
        run: uv run --no-sync mkdocs build

      - name: Build distribution
        if: matrix.python-version == '3.10'
        run: uv build

      - name: Upload dependency verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-refresh-python-${{ matrix.python-version }}
          path: |
            uv.lock
            dependency-refresh-packages.json
            dependency-refresh-tests.xml
            dist/
          if-no-files-found: error
          retention-days: 7