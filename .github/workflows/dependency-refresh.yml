name: Refresh dependencies

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  refresh:
    if: github.head_ref == 'chore/dependency-refresh-20260911'
    runs-on: ubuntu-latest
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python install 3.10

      - name: Refresh and verify dependencies
        run: |
          uv lock --upgrade
          uv sync --locked --all-extras --dev --group docs
          uv pip check
          uv pip list --format json > dependency-refresh-packages.json

      - name: Upload dependency lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-refresh
          path: |
            uv.lock
            dependency-refresh-packages.json
          if-no-files-found: error
          retention-days: 7